out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: True
  project: ZINC
  entity: miw039-uc-san-diego
dataset:
  format: PyG-ZINC
  name: subset
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode+RWSE
  node_encoder_num_types: 28
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
model:
  type: custom_gnn
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add
gt:
  layers: 10
  n_heads: 8
  dim_hidden: 128  # `gt.dim_hidden` must match `gnn.dim_inner`
  full_graph: True
  gamma: 1e-5
  dropout: 0.0
  layer_norm: False
  batch_norm: True
  residual: True
gnn:
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 3
  dim_inner: 128
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False
  layer_type: gatedgcnconv
optim:
  optimizer: adam
  weight_decay: 0.0
  base_lr: 0.0007
  max_epoch: 300
  scheduler: reduce_on_plateau
  reduce_factor: 0.5
  schedule_patience: 25
  min_lr: 1e-6
